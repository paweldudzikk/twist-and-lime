<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twist &amp; Lime — Mobilny Drink Bar Lublin</title>
<meta name="description" content="Twist & Lime — mobilny drink bar w Lublinie. Obsługa barmańska na wesela, imprezy firmowe i eventy prywatne. Autorskie koktajle, profesjonalna ekipa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a08;
    --charcoal:#141410;
    --charcoal-2:#1c1c15;
    --gold:#c9a15a;
    --gold-light:#e8cd93;
    --gold-dark:#8a6a34;
    --lime:#8bc63f;
    --lime-light:#a8d968;
    --lime-dark:#5c8a2a;
    --cream:#f3efe4;
    --muted:#a39b86;
    --hairline:rgba(201,161,90,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--black);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .container{max-width:1180px;margin:0 auto;padding:0 32px;}

  ::selection{background:var(--lime-dark);color:var(--cream);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--lime);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    padding:22px 0;
    transition:background .4s ease, padding .4s ease, border-color .4s ease;
    border-bottom:1px solid transparent;
  }
  header.scrolled{
    background:rgba(10,10,8,0.92);
    backdrop-filter:blur(10px);
    padding:14px 0;
    border-bottom:1px solid var(--hairline);
  }
  nav{display:flex; align-items:center; justify-content:space-between;}
  .brandmark{display:flex; align-items:center; gap:12px;}
  .brandmark img{height:46px; width:46px; border-radius:50%; transition:height .4s ease, width .4s ease;}
  header.scrolled .brandmark img{height:38px; width:38px;}
  .brandmark .name{font-family:'Playfair Display',serif; font-size:1.05rem; letter-spacing:.06em; line-height:1.1;}
  .brandmark .name b{color:var(--gold-light); font-weight:600;}
  .brandmark .name span{color:var(--lime-light); display:block; font-size:.72rem; letter-spacing:.32em; font-family:'Jost',sans-serif; margin-top:2px;}
  .navlinks{display:flex; gap:34px; align-items:center;}
  .navlinks a{font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); position:relative; padding-bottom:4px;}
  .navlinks a::after{content:"";position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--lime); transition:width .3s ease;}
  .navlinks a:hover{color:var(--cream);}
  .navlinks a:hover::after{width:100%;}
  .nav-cta{
    border:1px solid var(--gold); color:var(--gold-light) !important;
    padding:10px 22px; border-radius:999px; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
    transition:background .3s ease, color .3s ease;
  }
  .nav-cta:hover{background:var(--gold); color:var(--black) !important;}
  .menu-toggle{display:none; background:none; border:none; color:var(--cream); font-size:1.6rem; cursor:pointer;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:160px 24px 100px;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(139,198,63,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(201,161,90,0.08), transparent 60%),
      var(--black);
    overflow:hidden;
  }
  .ring{
    position:absolute; border-radius:50%; border:1px solid var(--hairline);
    pointer-events:none;
  }
  .ring--1{width:640px; height:640px; top:8%; left:50%; transform:translateX(-50%); animation:spin 90s linear infinite;}
  .ring--2{width:800px; height:800px; top:0; left:50%; transform:translateX(-50%); border-color:rgba(139,198,63,0.14); animation:spin 120s linear infinite reverse;}
  @keyframes spin{from{transform:translateX(-50%) rotate(0deg);} to{transform:translateX(-50%) rotate(360deg);}}

  .hero-inner{position:relative; z-index:2; max-width:800px;}
  .eyebrow{
    font-size:.78rem; letter-spacing:.42em; text-transform:uppercase; color:var(--lime-light);
    margin-bottom:22px; display:inline-block;
  }
  .hero h1{
    font-size:clamp(2.6rem, 6vw, 4.6rem); line-height:1.05; font-weight:600; color:var(--gold-light);
    margin-bottom:10px;
  }
  .hero h1 em{color:var(--lime-light); font-style:italic; font-weight:500;}
  .hero p.lead{
    font-size:1.15rem; color:var(--muted); max-width:560px; margin:22px auto 42px; line-height:1.7;
  }
  .cta-row{display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
  .btn{
    padding:15px 34px; border-radius:999px; font-size:.85rem; letter-spacing:.14em; text-transform:uppercase;
    transition:transform .3s ease, background .3s ease, color .3s ease, box-shadow .3s ease;
    display:inline-block;
  }
  .btn-primary{background:var(--gold); color:var(--black); font-weight:500;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(201,161,90,0.25);}
  .btn-ghost{border:1px solid var(--muted); color:var(--cream);}
  .btn-ghost:hover{border-color:var(--lime); color:var(--lime-light); transform:translateY(-2px);}

  .scroll-cue{
    position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--muted); font-size:.7rem;
    letter-spacing:.3em; text-transform:uppercase; z-index:2;
  }
  .scroll-cue .line{width:1px; height:34px; background:linear-gradient(var(--gold), transparent); animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3;} 50%{opacity:1;}}

  /* ---------- SECTION SHARED ---------- */
  section{padding:120px 0;}
  .section-head{text-align:center; max-width:640px; margin:0 auto 64px;}
  .section-head .eyebrow{color:var(--gold);}
  .section-head h2{font-size:clamp(2rem, 4vw, 2.8rem); font-weight:600; color:var(--cream); margin:14px 0 18px;}
  .section-head h2 em{color:var(--lime-light); font-style:italic;}
  .section-head p{color:var(--muted); font-size:1.02rem; line-height:1.75;}

  /* ---------- O NAS ---------- */
  .about{background:var(--black);}
  .about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:80px; align-items:center;}
  .about-visual{
    position:relative; aspect-ratio:1/1; border-radius:50%;
    border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
  }
  .about-visual::before{
    content:""; position:absolute; inset:22px; border-radius:50%; border:1px solid var(--hairline);
  }
  .about-visual img{width:80%; border-radius:50%; object-fit:cover;}
  .about-text .eyebrow{color:var(--lime-light);}
  .about-text h2{font-size:clamp(1.8rem,3.4vw,2.5rem); color:var(--gold-light); margin:14px 0 22px; font-weight:600;}
  .about-text p{color:var(--muted); line-height:1.85; margin-bottom:18px; font-size:1rem;}
  .stat-row{display:flex; gap:44px; margin-top:34px;}
  .stat b{display:block; font-family:'Playfair Display',serif; font-size:2rem; color:var(--lime-light);}
  .stat span{font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}

  /* ---------- OFERTA ---------- */
  .offer{background:var(--charcoal);}
  .offer-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:32px;}
  .offer-card{
    background:var(--charcoal-2); border:1px solid var(--hairline); border-radius:6px;
    padding:44px 34px; position:relative; transition:transform .35s ease, border-color .35s ease;
  }
  .offer-card:hover{transform:translateY(-6px); border-color:var(--gold);}
  .offer-num{font-family:'Playfair Display',serif; font-style:italic; color:var(--gold-dark); font-size:.95rem; margin-bottom:26px; display:block;}
  .offer-card h3{color:var(--gold-light); font-size:1.4rem; font-weight:600; margin-bottom:14px;}
  .offer-card p{color:var(--muted); line-height:1.7; font-size:.94rem; margin-bottom:22px;}
  .offer-card a.more{color:var(--lime-light); font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; border-bottom:1px solid var(--lime-dark); padding-bottom:2px;}

  /* ---------- MENU / KOKTAJLE ---------- */
  .menu-sec{background:var(--black);}
  .menu-list{display:grid; grid-template-columns:1fr 1fr; gap:0 60px; max-width:920px; margin:0 auto;}
  .menu-item{display:flex; justify-content:space-between; gap:18px; padding:20px 0; border-bottom:1px solid var(--hairline);}
  .menu-item .mi-name{color:var(--cream); font-family:'Playfair Display',serif; font-size:1.15rem;}
  .menu-item .mi-tag{display:block; color:var(--lime-light); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; font-family:'Jost',sans-serif;}
  .menu-item .mi-desc{color:var(--muted); font-size:.85rem; margin-top:6px; line-height:1.5; font-family:'Jost',sans-serif;}

  /* ---------- GALERIA ---------- */
  .gallery{background:var(--charcoal);}
  .gal-grid{display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; gap:14px;}
  .gal-grid > div:nth-child(1){grid-column:span 2; grid-row:span 2;}
  .gal-grid > div:nth-child(4){grid-row:span 2;}
  .gal-tile{
    border-radius:6px; position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:18px;
    border:1px solid var(--hairline);
  }
  .gal-tile span{position:relative; z-index:2; font-family:'Playfair Display',serif; font-style:italic; color:var(--cream); font-size:.95rem;}
  .gal-tile::before{content:""; position:absolute; inset:0; opacity:.9;}
  .gal-tile::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.65), transparent 60%);}
  .g1::before{background:radial-gradient(circle at 30% 20%, #3a5a1c, #0a0a08 70%);}
  .g2::before{background:radial-gradient(circle at 70% 30%, #6b8f2f, #0a0a08 70%);}
  .g3::before{background:radial-gradient(circle at 40% 60%, #8a6a34, #0a0a08 70%);}
  .g4::before{background:radial-gradient(circle at 60% 40%, #2f4a15, #0a0a08 70%);}
  .g5::before{background:radial-gradient(circle at 50% 50%, #b08d4f, #0a0a08 70%);}
  .g6::before{background:radial-gradient(circle at 50% 20%, #5c8a2a, #0a0a08 70%);}



  <!-- HERO -->
  <section class="hero">
    <div class="ring ring--1"></div>
    <div class="ring ring--2"></div>
    <div class="hero-inner">
      <span class="eyebrow">Lublin i okolice</span>
      <h1>Twist <em>&amp;</em> Lime</h1>
      <p class="lead">Mobilny drink bar, który wnosi na Twoją imprezę profesjonalną obsługę, autorskie miksy i barmanów, którzy potrafią rozkręcić każdy wieczór.</p>
      <div class="cta-row">
        <a href="#kontakt" class="btn btn-primary">Zapytaj o wycenę</a>
        <a href="#oferta" class="btn btn-ghost">Zobacz ofertę</a>
      </div>
    </div>
    <div class="scroll-cue"><span>Przewiń</span><div class="line"></div></div>
  </section>

  <!-- O NAS -->
  <section class="about" id="onas">
    <div class="container about-grid">
      <div class="about-visual">
        <img src="logo.png" alt="Twist &amp; Lime — mobilny drink bar Lublin">
      </div>
      <div class="about-text reveal">
        <span class="eyebrow">Kim jesteśmy</span>
        <h2>Bar, który przyjeżdża<br>tam, gdzie Ty świętujesz</h2>
        <p>Twist &amp; Lime to mobilny drink bar działający w Lublinie i całym regionie lubelskim. Przyjeżdżamy z własnym barem, szkłem, dekoracjami i pełnym zapleczem barmańskim — Ty zajmujesz się świętowaniem, my resztą.</p>
        <p>Od pierwszego kontaktu po ostatni podany drink dbamy o to, żeby wszystko grało: dopasowaną kartę koktajli, estetykę baru pasującą do wystroju sali i pozytywną atmosferę.</p>
        <div class="stat-row">
          <div class="stat"><b>150+</b><span>Zrealizowanych imprez</span></div>
          <div class="stat"><b>30+</b><span>Autorskich receptur</span></div>
          <div class="stat"><b>100%</b><span>Świeżych składników</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- OFERTA -->
  <section class="offer" id="oferta">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Oferta</span>
        <h2>Jedna ekipa, <em>trzy okazje</em></h2>
        <p>Dobieramy format baru i kartę koktajli do charakteru wydarzenia — od kameralnego wesela po firmową galę.</p>
      </div>
      <div class="offer-grid">
        <div class="offer-card reveal">
          <span class="offer-num">Wesela</span>
          <h3>Bar weselny</h3>
          <p>Elegancki bar dopasowany do dekoracji sali, karta koktajli dla Pary Młodej i gości, wersje z alkoholem i bez.</p>
          <a href="#kontakt" class="more">Zapytaj o termin →</a>
        </div>
        <div class="offer-card reveal">
          <span class="offer-num">Firmy</span>
          <h3>Eventy firmowe</h3>
          <p>Bar na konferencje, gale i imprezy integracyjne. Możliwość brandingu baru logotypem firmy.</p>
          <a href="#kontakt" class="more">Zapytaj o ofertę →</a>
        </div>
        <div class="offer-card reveal">
          <span class="offer-num">Prywatne</span>
          <h3>Urodziny i jubileusze</h3>
          <p>Kameralny bar na przyjęcia domowe i ogrodowe — od kilkunastu do kilkuset gości.</p>
          <a href="#kontakt" class="more">Zapytaj o wolne terminy →</a>
        </div>
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section class="menu-sec" id="menu">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Karta koktajli</span>
        <h2>Klasyczne <em>pozycje</em> z naszej karty</h2>
        <p>Pełną kartę ustalamy indywidualnie — poniżej kilka najbardziej popularnych klasyków, które najczęściej trafiają na wesela i eventy.</p>
      </div>
      <div class="menu-list">
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Mojito</span>
            <span class="mi-desc">Biały rum, świeża mięta, limonka, cukier trzcinowy, woda gazowana, kruszony lód</span>
          </div>
          <span class="mi-tag">Klasyk</span>
        </div>
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Aperol Spritz</span>
            <span class="mi-desc">Aperol, Prosecco, woda gazowana, świeża pomarańcza</span>
          </div>
          <span class="mi-tag">Bestseller</span>
        </div>
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Hugo Spritz</span>
            <span class="mi-desc">Prosecco, syrop z kwiatu czarnego bzu, świeża mięta, limonka, woda gazowana</span>
          </div>
          <span class="mi-tag">Lekki</span>
        </div>
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Whisky Sour</span>
            <span class="mi-desc">Bourbon / Whisky, sok z cytryny, syrop cukrowy, opcjonalnie pianka (białko/aquafaba)</span>
          </div>
          <span class="mi-tag">Elegancki</span>
        </div>
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Cuba Libre</span>
            <span class="mi-desc">Ciemny lub jasny rum, Coca-Cola, świeży sok z limonki</span>
          </div>
          <span class="mi-tag">Imprezowy</span>
        </div>
        <div class="menu-item reveal">
          <div>
            <span class="mi-name">Piña Colada</span>
            <span class="mi-desc">Biały rum, mleczko kokosowe, sok ananasowy, świeża limonka</span>
          </div>
          <span class="mi-tag">Egzotyczny</span>
        </div>
      </div>
    </div>
  </section>

  <!-- GALERIA -->
  <section class="gallery" id="galeria">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Galeria</span>
        <h2>Bar w <em>akcji</em></h2>
        <p>Zdjęcia z naszych realizacji dodamy tutaj po najbliższych eventach — na razie zapraszamy do kontaktu po portfolio.</p>
      </div>
      <div class="gal-grid reveal">
        <div class="gal-tile g1"><span>Bar weselny</span></div>
        <div class="gal-tile g2"><span>Mobilny Drink Bar</span></div>
        <div class="gal-tile g3"><span>Dekoracje</span></div>
        <div class="gal-tile g4"><span>Event firmowy</span></div>
        <div class="gal-tile g5"><span>Karta koktajli</span></div>
        <div class="gal-tile g6"><span>Atmosfera</span></div>
      </div>
    </div>
  </section>

  <!-- OPINIE -->
  <section class="reviews" id="opinie">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Opinie</span>
        <h2>Co mówią <em>nasi goście</em></h2>
      </div>
      <div class="rev-track reveal">
        <div class="rev-card">
          <div>
            <div class="stars">★★★★★</div>

          </div>
          <div><div class="who">Ania i Michał</div><div class="where">Lublin</div></div>
        </div>
        <div class="rev-card">

          </div>
          <div><div class="who">Kasia i Paweł</div><div class="where">Świdnik</div></div>
        </div>
        <div class="rev-card">
          <div>
            <div class="stars">★★★★★</div>

          </div>
          <div><div class="who">Zespół BiuroTech</div><div class="where">Lublin</div></div>
        </div>
        <div class="rev-card">
          <div>
            <div class="stars">★★★★★</div>

          </div>
          <div><div class="who">Justyna i Wojtek</div><div class="where">Puławy</div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- KONTAKT -->
  <section class="contact" id="kontakt">
    <div class="container contact-grid">
      <div class="contact-info reveal">
        <span class="eyebrow" style="color:var(--lime-light)">Kontakt</span>
        <h2>Porozmawiajmy<br>o Twoim wydarzeniu</h2>
        <p>Napisz kilka słów o okazji, liczbie gości i lokalizacji — odpowiemy z propozycją oferty dopasowaną do Twojego budżetu.</p>
        <div class="contact-line"><b>Telefon</b><a href="tel:+48000000000">+48 000 000 000</a></div>
        <div class="contact-line"><b>E-mail</b><a href="mailto:kontakt@twistandlime.pl">kontakt@twistandlime.pl</a></div>
        <div class="contact-line"><b>Zasięg</b><span>Lublin i województwo lubelskie</span></div>
        <div class="contact-line"><b>Godziny</b><span>Pon.–Sob. 10:00–19:00</span></div>
        <div class="social-row">
          <a href="#" aria-label="Facebook"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.5H16l.5-3.5h-3V7.7c0-1 .3-1.7 1.8-1.7H16.5V2.8C16.1 2.8 15 2.7 13.7 2.7c-2.7 0-4.5 1.6-4.5 4.6V10H6.5v3.5H9.2V22h4.3z"/></svg></a>
          <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg></a>
        </div>
      </div>

      <form class="reveal" action="#" method="POST">
        <div class="form-row">
          <div>
            <label for="name">Imię i nazwisko</label>
            <input type="text" id="name" name="name" placeholder="np. Jan Kowalski" required>
          </div>
          <div>
            <label for="phone">Numer telefonu</label>
            <input type="tel" id="phone" name="phone" placeholder="np. +48 123 456 789" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="type">Rodzaj imprezy</label>

<script>
  // Dynamic header background change on scroll
  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });

  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('open');
  });

  // Close menu on link click (mobile)
  document.querySelectorAll('.navlinks a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
    });
  });

  // Reveal animations on scroll
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in');
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
